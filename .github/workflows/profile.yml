name: Validate profile illustration

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update-profile.py
      - assets/profile.svg
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Render illustration
        run: python3 scripts/update-profile.py
      - name: Check generated illustration
        run: git diff --exit-code -- assets/profile.svg
